[alembic]
# Path to migration scripts
script_location = alembic

# Revision file naming convention: {year}{month}{day}_{rev}_{slug}
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Maximum character length for slug
truncate_slug_length = 40

# SQLAlchemy URL — overridden at runtime by alembic/env.py from settings
sqlalchemy.url = postgresql+asyncpg://localhost/drama_factory

# Output encoding
output_encoding = utf-8


[post_write_hooks]
# Automatically format new migrations with ruff
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format %(output)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
