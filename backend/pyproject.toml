[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drama-factory-backend"
version = "0.1.0"
description = "Drama Factory AI Platform Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # AI / LLM
    "anthropic>=0.28.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.5",
    "langsmith>=0.1.75",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "pgvector>=0.3.2",
    "supabase>=2.5.0",

    # Cache & queues
    "redis[hiredis]>=5.0.4",
    "celery[redis]>=5.4.0",

    # Auth / security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.3",

    # HTTP clients & scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",

    # Utilities
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "orjson>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
